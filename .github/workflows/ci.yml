name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System libs (libsndfile for soundfile; ffmpeg for PyAV fallback)
        run: sudo apt-get update && sudo apt-get install -y libsndfile1 ffmpeg

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # Relay runtime (Linux subset, no macOS pyobjc) + dev/test deps
          pip install -r requirements-server.txt
          pip install -r requirements-dev.txt

      - name: Unit + integration tests (externals mocked, no secrets needed)
        shell: bash
        run: |
          set -o pipefail
          pytest tests/ --ignore=tests/web -rA -v 2>&1 | tee pytest-unit.log
          echo "exit=${PIPESTATUS[0]}" > pytest-unit.exit

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Web tests (Playwright against local relay)
        shell: bash
        run: |
          set -o pipefail
          pytest tests/web -rA -v 2>&1 | tee pytest-web.log

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-logs
          path: |
            pytest-*.log
            pytest-*.exit
