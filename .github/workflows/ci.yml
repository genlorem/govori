name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "latency-optimization"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System libs (libsndfile for soundfile; ffmpeg for PyAV fallback)
        run: sudo apt-get update && sudo apt-get install -y libsndfile1 ffmpeg

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # Relay runtime (Linux subset, no macOS pyobjc) + dev/test deps
          pip install -r requirements-server.txt
          pip install -r requirements-dev.txt

      - name: Unit + integration tests (externals mocked, no secrets needed)
        run: pytest tests/ --ignore=tests/web -q

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Web tests (Playwright against local relay)
        run: pytest tests/web -q
